{% extends "cheeserate/base.html" %}

{% block title %} Cheeserate - Cheesy Rating Forum {% endblock %}

{% block content %}

Newest Additions:

<ul>
  {% for film in films %}

    <a href="{% url 'film' film.trakt_slug %}"

  </li>
  {% endfor %}

{% endblock %}
