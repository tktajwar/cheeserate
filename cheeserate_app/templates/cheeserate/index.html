{% extends "cheeserate/base.html" %}

{% block title %} Cheeserate - Cheesy Rating Forum {% endblock %}

{% block content %}

{% if films %}
<div id="newly-added" class="max-w-6xl m-auto p-4">
  <section id="newly-added-films">
    <h2 class="text-2xl">
      Newly Added Films
    </h2>
    <div id="films-list"
	 class="grid lg:grid-cols-6 grid-cols-4 gap-1">
      {{films|safe}}
    </div>
  </section>
</div>
{% endif %}

{% endblock %}
